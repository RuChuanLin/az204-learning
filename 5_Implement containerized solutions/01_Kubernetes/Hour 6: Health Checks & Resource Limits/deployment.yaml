apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-node-deployment   # Name of the Deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-node-app        # This label MUST match the Service selector
  template:
    metadata:
      labels:
        app: hello-node-app      # This label is applied to the pods
    spec:
      containers:
        - name: hello-node
          image: nginxdemos/hello
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5

